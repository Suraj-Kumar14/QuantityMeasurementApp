spring:
  application:
    name: quantity-measurement-app

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-google-secret}
            scope:
              - openid
              - profile
              - email

          github:
            client-id: ${GITHUB_CLIENT_ID:test-github-client}
            client-secret: ${GITHUB_CLIENT_SECRET:test-github-secret}
            scope:
              - read:user
              - user:email

  datasource:
    url: jdbc:mysql://localhost:3306/kali
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:none}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    root: INFO
    com.app.quantitymeasurement: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

springdoc:
  swagger-ui:
    enabled: true

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationAtLeast32CharsLong123}
    expiration-ms: 86400000