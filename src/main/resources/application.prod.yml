spring:
  application:
    name: quantity-measurement-app

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          github:
            client-id: ${GITHUB_CLIENT_ID:test-github-client}
            client-secret: ${GITHUB_CLIENT_SECRET:test-github-secret}
            scope:
              - read:user
              - user:email

  datasource:
    url: jdbc:h2:file:/app/data/quantitymeasurementdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

logging:
  level:
    root: INFO
    com.app.quantitymeasurement: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

springdoc:
  swagger-ui:
    enabled: true

server:
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000