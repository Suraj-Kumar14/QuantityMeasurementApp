spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
            scope:
              - openid
              - profile
              - email

          github:
            client-id: test-github-client
            client-secret: test-github-secret
            scope:
              - read:user
              - user:email

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.app.quantitymeasurement: DEBUG

app:
  frontend-url: http://localhost:3000
  jwt:
    secret: ThisIsATestSecretKeyForJwtTokenGeneration12345
    expiration-ms: 3600000

server:
  port: 8080