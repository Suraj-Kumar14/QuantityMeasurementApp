spring:
  application:
    name: quantity-measurement-app

  profiles:
    active: dev

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-google-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-google-secret}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:test-github-client}
            client-secret: ${GITHUB_CLIENT_SECRET:test-github-secret}
            scope:
              - read:user
              - user:email

server:
  port: 8080

logging:
  level:
    root: INFO
    com.app.quantitymeasurement: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationAtLeast32CharsLong123}
    expiration-ms: 86400000