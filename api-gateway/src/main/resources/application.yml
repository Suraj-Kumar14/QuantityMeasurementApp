server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:mysupersecuresecretkeymysupersecuresecretkey1234567890}
    expiration-ms: 3600000

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service-auth
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: auth-service-oauth2
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/oauth2/**

        - id: auth-service-login
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/login/**

        - id: quantity-service
          uri: lb://QUANTITY-SERVICE
          predicates:
            - Path=/api/v1/quantities/**
          filters:
            - AuthenticationFilter

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/